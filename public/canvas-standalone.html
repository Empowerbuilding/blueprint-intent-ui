<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Barnhaus Design Canvas v4 — Drawable Matrix &amp; Direct Level/Bay Studio</title>
<style>
  :root {
    --bg: #080d16; --panel: #101827; --card: #172236; --border: #263652;
    --gold: #eab308; --gold-lt: #fde047; --cyan: #00e0ff; --emerald: #10b981;
    --amber: #f59e0b; --rose: #fb7185; --text: #f1f5f9; --muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, select { font: inherit; cursor: pointer; }
  .app { display: flex; flex-direction: column; height: 100dvh; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 10; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .brand-dot { width: 10px; height: 10px; border-radius: 2px; background: var(--gold); }
  .pill-group { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
  .pill-btn { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; min-height: 30px; }
  .pill-btn.active { background: var(--gold); color: #090d16; font-weight: 700; }
  .chip-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 5px 9px; border-radius: 7px; font-size: 11.5px; font-weight: 600; min-height: 32px; }
  .chip-btn.on { border-color: var(--cyan); background: rgba(0,224,255,0.16); color: #67e8f9; }
  .chip-btn.notes-on { border-color: var(--emerald); background: rgba(16,185,129,0.18); color: #6ee7b7; }
  .chip-btn.gold { border-color: var(--gold); background: var(--gold); color: #090d16; font-weight: 700; }

  .mob-tabs { display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .mob-tab { border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 8px; min-height: 40px; font-size: 12px; font-weight: 700; padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mob-tab.active { background: var(--gold); color: #090d16; border-color: var(--gold); }

  .body { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .left-pane { width: 270px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 10px; gap: 7px; }
  .center-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .right-pane { width: 350px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 11px; gap: 11px; }

  .subbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .stage-wrap { flex: 1; position: relative; min-height: 0; overflow: hidden; touch-action: none; user-select: none; }
  .stage-svg { width: 100%; height: 100%; display: block; }

  .float-card { position: absolute; left: 12px; right: 12px; bottom: 12px; max-width: 650px; margin-left: auto; background: rgba(16,24,39,0.95); border: 1px solid rgba(234,179,8,0.55); border-radius: 12px; padding: 9px 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); backdrop-filter: blur(8px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .room-row { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; color: var(--text); margin-bottom: 4px; }
  .room-row.active { border-color: var(--cyan); background: rgba(0,224,255,0.12); }
  .sec-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .note-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 11.5px; margin-bottom: 5px; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; font-family: ui-monospace, monospace; }
  .bay-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px; font-size: 12px; }
  .thumb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }
  .thumb-item { border-radius: 6px; overflow: hidden; border: 1px solid var(--border); background: #05080f; cursor: pointer; position: relative; }
  .thumb-item img { width: 100%; height: 84px; object-fit: cover; display: block; }
  .thumb-cap { font-size: 9.5px; padding: 3px 5px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lightbox { position: fixed; inset: 0; background: rgba(4,8,15,0.92); z-index: 100; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
  .lightbox img { max-width: 94vw; max-height: 82dvh; border-radius: 10px; border: 1px solid var(--gold); }

  @media (max-width: 1023px) {
    .mob-tabs { display: grid; }
    .left-pane, .right-pane, .center-pane { display: none; width: 100%; border: 0; }
    .body[data-mob="house"] .center-pane,
    .body[data-mob="room"] .center-pane { display: flex; }
    .body[data-mob="notes"] .right-pane { display: flex; }
    .hide-mob { display: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="brand"><span class="brand-dot"></span>Barnhaus Canvas v4 <span style="font-size:10.5px;color:var(--emerald);font-weight:700;">⚡ Deubner Rules · 0ms</span></div>
      <div class="pill-group" id="floorPills">
        <button class="pill-btn active" onclick="setLevel(1)">L1 · Main</button>
        <button class="pill-btn" onclick="setLevel(2)">L2 · Upper</button>
      </div>
      <button class="chip-btn gold" id="btnHouseMode" onclick="toggleHouseMode()">🏠 Whole House</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <button class="chip-btn on" id="btnGrids" onclick="state.showGrids=!state.showGrids;renderAll()">⊞ Grids: ON</button>
      <button class="chip-btn notes-on" id="btnNotes" onclick="state.showNotes=!state.showNotes;renderAll()">📝 D1 Intent + Arrows: ON</button>
      <button class="chip-btn" id="btnTheme" onclick="state.theme=state.theme==='blueprint'?'paper':'blueprint';renderAll()">CAD: Blueprint</button>
      <button class="chip-btn hide-mob" onclick="exportJson()">Export JSON</button>
    </div>
  </div>

  <!-- MOBILE 3-TAB BAR -->
  <div class="mob-tabs">
    <button class="mob-tab active" id="mtab-house" onclick="setMobTab('house')">🏠 House Plan</button>
    <button class="mob-tab" id="mtab-room" onclick="setMobTab('room')">📐 Room Elev</button>
    <button class="mob-tab" id="mtab-notes" onclick="setMobTab('notes')">🖼️ Inspo &amp; Transcript</button>
  </div>

  <!-- MAIN STUDIO BODY -->
  <div class="body" id="studioBody" data-mob="house">
    <aside class="left-pane" id="leftRoomList"></aside>
    <main class="center-pane">
      <div class="subbar" id="stageSubbar"></div>
      <div class="stage-wrap" id="stageWrap">
        <svg class="stage-svg" id="stageSvg"></svg>
        <div class="float-card" id="floatRoomCard"></div>
      </div>
    </main>
    <aside class="right-pane" id="rightInspector"></aside>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
  <img id="lightboxImg" src="" alt="Inspiration Preview" />
  <div id="lightboxCap" style="margin-top:10px;font-size:13px;font-weight:600;color:var(--gold-lt);"></div>
</div>

MATRIX.rooms.forEach(rm => {
  if (!rm.datums || rm.datums.length < 4) {
    rm.datums = [
      { id: `d-${rm.id}-18`,  affIn: 18,  label: '18" BENCH / LIFT' },
      { id: `d-${rm.id}-36`,  affIn: 36,  label: '36" COUNTER' },
      { id: `d-${rm.id}-54`,  affIn: 54,  label: '54" UPPER BOT / SPLASH' },
      { id: `d-${rm.id}-108`, affIn: 108, label: '9\'-0" TOP ALIGN' }

  }

let state = {
  level: 1,
  mode: 'house',     // 'house' | 'room'
  mobTab: 'house',
  planTool: 'select', // 'select' | 'draw_line' | 'section_cut'
  roomId: '113',
  wallId: 'S',
  bayIdx: 0,
  showNotes: true,
  showD1Lines: true,
  showGrids: true,
  theme: 'blueprint',
  zoom: 1,
  panX: 0,
  panY: 0,
  draftDrag: null    // for live drawing lines/cuts on plan OR dragging horizontal levels / vertical bay dividers!
};

function fmtFtIn(inc) {
  const v = Math.round(Math.abs(inc) * 2) / 2;
  const ft = Math.floor(v / 12);
  const rem = v - ft * 12;
  const ri = Math.floor(rem);
  const hf = Math.abs(rem - ri - 0.5) < 0.01 ? ' 1/2' : '';
  return `${ft}'-${ri}${hf}"`;
}
function snapHalf(v) { return Math.round(v * 2) / 2; }

function getEffRect(rm) {
  const r = { ...rm.planRect };
  if (rm.flexPlanBinding) {
    const fw = MATRIX.flexWalls[rm.flexPlanBinding.flexWallId];
    if (fw && fw.nudgeIn) {
      if (rm.flexPlanBinding.role === 'expand_east') r.widthIn += fw.nudgeIn;
      else if (rm.flexPlanBinding.role === 'shift_west') { r.xIn += fw.nudgeIn; r.widthIn -= fw.nudgeIn; }
    }
  }
  return r;
}
function levelRooms() { return MATRIX.rooms.filter(r => (r.level || 1) === state.level); }
function activeRoom() { return MATRIX.rooms.find(r => r.id === state.roomId) || levelRooms()[0]; }
function activeWall() { const rm = activeRoom(); return rm.walls.find(w => w.id === state.wallId) || rm.walls[0]; }

function setLevel(lvl) {
  state.level = lvl;
  const r0 = levelRooms()[0];
  if (r0 && (activeRoom().level || 1) !== lvl) {
    state.roomId = r0.id;
    const w0 = r0.walls.find(w => w.bays.length > 0) || r0.walls[0];
    state.wallId = w0.id; state.bayIdx = 0;
  }
  state.zoom = 1; state.panX = 0; state.panY = 0; renderAll();
}
function toggleHouseMode() {
  state.mode = state.mode === 'house' ? 'room' : 'house';
  state.mobTab = state.mode;
  state.zoom = 1; state.panX = 0; state.panY = 0; renderAll();
}
function setMobTab(tab) {
  state.mobTab = tab;
  if (tab === 'house') state.mode = 'house';
  if (tab === 'room') state.mode = 'room';
  state.zoom = 1; state.panX = 0; state.panY = 0; renderAll();
}
function selectRoom(rid, enterStudio = false) {
  if (state.planTool !== 'select' && !enterStudio) return;
  const rm = MATRIX.rooms.find(r => r.id === rid);
  if (!rm) return;
  state.level = rm.level || 1; state.roomId = rid;
  const w0 = rm.walls.find(w => w.bays.length > 0) || rm.walls[0];
  state.wallId = w0.id; state.bayIdx = 0;
  if (enterStudio) { state.mode = 'room'; state.mobTab = 'room'; state.zoom = 1; state.panX = 0; state.panY = 0; }
  renderAll();
}
function toggleWallElevScope(wallDir) {
  const rm = activeRoom();
  const wl = rm.walls.find(w => w.id === wallDir);
  if (wl) { wl.elevOnSheet = !wl.elevOnSheet; renderAll(); }
}
function addHorizontalLevel() {
  const rm = activeRoom();
  const aff = 72;
  rm.datums.push({ id: `d-${rm.id}-${Date.now()}`, affIn: aff, label: `${aff}" CUSTOM LEVEL` });
  renderAll();
}
function splitSelectedBay() {
  const w = activeWall();
  if (w.bays.length === 0) {
    w.bays.push({ id: `bay-${Date.now()}-1`, kind: 'drawer_stack', label: 'Base Drawer Bay', widthIn: 36, heightIn: 36, depthIn: 24, affIn: 0 });
    w.bays.push({ id: `bay-${Date.now()}-2`, kind: 'drawer_stack', label: 'Base Drawer Bay', widthIn: 36, heightIn: 36, depthIn: 24, affIn: 0 });
    renderAll(); return;
  }
  const idx = Math.min(state.bayIdx, w.bays.length - 1);
  const orig = w.bays[idx];
  if (orig.widthIn < 24) return;
  const half = Math.round(orig.widthIn / 2);
  const rem = orig.widthIn - half;
  orig.widthIn = half;
  w.bays.splice(idx + 1, 0, { ...orig, id: `${orig.id}-split-${Date.now()}`, widthIn: rem });
  renderAll();
}
function nudgeFlex(fid, delta) {
  const fw = MATRIX.flexWalls[fid];
  if (!fw) return;
  fw.nudgeIn = Math.max(-fw.maxNudgeIn, Math.min(fw.maxNudgeIn, fw.nudgeIn + delta));
  renderAll();
}
function openLightbox(src, cap) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxCap').textContent = cap;
  document.getElementById('lightbox').style.display = 'flex';
}
function exportJson() {
  const blob = new Blob([JSON.stringify(MATRIX, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'barnhaus-drawable-matrix-v4.json'; a.click();
}

// Convert client pointer event to SVG user-space (x, y) in inches!
function clientToSvgXY(e) {
  const svg = document.getElementById('stageSvg');
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return [0, 0];
  const loc = pt.matrixTransform(ctm.inverse());
  return [loc.x, loc.y];
}

// Unified Direct-Manipulation Pointer Engine:
//   1) Drag Horizontal Level handles up/down on Elevation!
//   2) Drag Vertical Bay Divider handles (◆) left/right on Elevation!
//   3) Draw Orthogonal Intent Lines or Section Cuts directly on Whole-House Plan!
//   4) Pan & Wheel Zoom!
(function initInteractiveCanvas() {
  const wrap = document.getElementById('stageWrap');
  let panDrag = null;

  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    state.zoom = Math.max(0.6, Math.min(3.2, +(state.zoom + (e.deltaY < 0 ? 0.14 : -0.14)).toFixed(2)));
    renderStage();
  }, { passive: false });

  wrap.addEventListener('pointerdown', e => {
    if (e.target.closest('.float-card')) return;
    const datumIdx = e.target.closest('[data-datum-idx]')?.dataset.datumIdx;
    const divIdx   = e.target.closest('[data-divider-idx]')?.dataset.dividerIdx;

    if (state.mode === 'room' && datumIdx !== undefined) {
      e.stopPropagation();
      const rm = activeRoom();
      const d = rm.datums[Number(datumIdx)];
      state.draftDrag = { kind: 'datum', idx: Number(datumIdx), oldAff: d.affIn };
      return;
    }
    if (state.mode === 'room' && divIdx !== undefined) {
      e.stopPropagation();
      const w = activeWall();
      const i = Number(divIdx);
      const [sx] = clientToSvgXY(e);
      state.draftDrag = { kind: 'divider', idx: i, startX: sx, wA: w.bays[i].widthIn, wB: w.bays[i+1].widthIn };
      return;
    }
    if (state.mode === 'house' && (state.planTool === 'draw_line' || state.planTool === 'section_cut')) {
      const [x, y] = clientToSvgXY(e);
      const sx = Math.round(x / 6) * 6, sy = Math.round(y / 6) * 6;
      state.draftDrag = { kind: state.planTool, x1: sx, y1: sy, x2: sx, y2: sy };
      renderStage();
      return;
    }
    if (e.target.closest('[data-click="1"]')) return;
    panDrag = { sx: e.clientX, sy: e.clientY, px: state.panX, py: state.panY };
  });

  wrap.addEventListener('pointermove', e => {
    if (state.draftDrag) {
      const [mx, my] = clientToSvgXY(e);
      if (state.draftDrag.kind === 'datum') {
        const rm = activeRoom();
        const w = activeWall();
        const H = w.ceilingHeightIn || 120;
        const d = rm.datums[state.draftDrag.idx];
        const prevAff = d.affIn;
        const newAff = Math.max(4, Math.min(H - 6, Math.round(H - my)));
        d.affIn = newAff;
        d.label = `${newAff >= 96 ? fmtFtIn(newAff) : newAff + '"'} LEVEL`;
        // Stretch any tall/upper bay locked to this level!
        w.bays.forEach(b => {
          if (Math.abs((b.affIn || 0) + b.heightIn - prevAff) <= 1.5) {
            b.heightIn = Math.max(12, newAff - (b.affIn || 0));
          }
        });
        renderStage(); renderInspector();
        return;
      }
      if (state.draftDrag.kind === 'divider') {
        const w = activeWall();
        const i = state.draftDrag.idx;
        const dx = snapHalf(mx - state.draftDrag.startX);
        const totalPair = state.draftDrag.wA + state.draftDrag.wB;
        const nextA = Math.max(12, Math.min(totalPair - 12, snapHalf(state.draftDrag.wA + dx)));
        w.bays[i].widthIn = nextA;
        w.bays[i+1].widthIn = snapHalf(totalPair - nextA);
        renderStage(); renderInspector();
        return;
      }
      if (state.draftDrag.kind === 'draw_line' || state.draftDrag.kind === 'section_cut') {
        let ex = Math.round(mx / 6) * 6, ey = Math.round(my / 6) * 6;
        // Orthogonal snap!
        if (Math.abs(ex - state.draftDrag.x1) >= Math.abs(ey - state.draftDrag.y1)) ey = state.draftDrag.y1;
        else ex = state.draftDrag.x1;
        state.draftDrag.x2 = ex; state.draftDrag.y2 = ey;
        renderStage();
        return;
      }
    }
    if (!panDrag) return;
    state.panX = panDrag.px + (e.clientX - panDrag.sx) / state.zoom;
    state.panY = panDrag.py + (e.clientY - panDrag.sy) / state.zoom;
    renderStage();
  });

  window.addEventListener('pointerup', () => {
    if (state.draftDrag) {
      const dd = state.draftDrag;
      if (dd.kind === 'draw_line' && Math.hypot(dd.x2 - dd.x1, dd.y2 - dd.y1) >= 12) {
        MATRIX.drawnLines.push({ id: `usr-${Date.now()}`, level: state.level, x1: dd.x1, y1: dd.y1, x2: dd.x2, y2: dd.y2 });
      } else if (dd.kind === 'section_cut' && Math.hypot(dd.x2 - dd.x1, dd.y2 - dd.y1) >= 36) {
        const lbl = String.fromCharCode(65 + MATRIX.sectionCuts.length);
        MATRIX.sectionCuts.push({ id: `sec-${lbl}`, label: lbl, level: state.level, x1: dd.x1, y1: dd.y1, x2: dd.x2, y2: dd.y2, lookDir: 'N' });
        state.planTool = 'select';
      }
      state.draftDrag = null;
      renderAll();
    }
    panDrag = null;
  });
})();

function renderAll() {
  const fp = document.getElementById('floorPills').children;
  fp[0].className = 'pill-btn' + (state.level === 1 ? ' active' : '');
  fp[1].className = 'pill-btn' + (state.level === 2 ? ' active' : '');
  const bh = document.getElementById('btnHouseMode');
  bh.textContent = state.mode === 'house' ? '🏠 Whole House (Active)' : '← Whole House Plan';
  bh.className = 'chip-btn' + (state.mode === 'house' ? ' gold' : '');
  document.getElementById('btnGrids').textContent = `⊞ Grids: ${state.showGrids ? 'ON' : 'OFF'}`;
  document.getElementById('btnGrids').className = 'chip-btn' + (state.showGrids ? ' on' : '');
  document.getElementById('btnNotes').textContent = `📝 D1 Intent + Arrows: ${state.showNotes ? 'ON' : 'OFF'}`;
  document.getElementById('btnNotes').className = 'chip-btn' + (state.showNotes ? ' notes-on' : '');
  document.getElementById('btnTheme').textContent = `CAD: ${state.theme === 'blueprint' ? 'Dark Blueprint' : 'Paper'}`;

  const rm = activeRoom();
  document.getElementById('studioBody').dataset.mob = state.mobTab;
  document.getElementById('mtab-house').className = 'mob-tab' + (state.mobTab === 'house' ? ' active' : '');
  document.getElementById('mtab-room').className = 'mob-tab' + (state.mobTab === 'room' ? ' active' : '');
  document.getElementById('mtab-room').textContent = `📐 ${rm.number} ${rm.name}`;
  document.getElementById('mtab-notes').className = 'mob-tab' + (state.mobTab === 'notes' ? ' active' : '');

  const lrms = levelRooms();
  document.getElementById('leftRoomList').innerHTML =
    `<div class="sec-lbl">Level ${state.level} Rooms (${lrms.length}) — Double-Click for Elev</div>` +
    lrms.map(r => {
      const rc = getEffRect(r);
      const elevCnt = r.walls.filter(w => w.elevOnSheet).length;
      return `<button class="room-row ${r.id === rm.id ? 'active' : ''}" onclick="selectRoom('${r.id}', false)" ondblclick="selectRoom('${r.id}', true)">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;">
          <span><span style="color:var(--muted);font-family:monospace;">${r.number}</span> ${r.name}</span>
          <span style="font-family:monospace;font-size:11px;color:var(--cyan);">${fmtFtIn(rc.widthIn)}×${fmtFtIn(rc.depthIn)}</span>
        </div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:165px;">${r.subtitle}</span>
          <span style="color:var(--gold-lt);">${elevCnt} elevs</span>
        </div>
      </button>`;
    }).join('');

  renderSubbar(); renderStage(); renderInspector();
}

function renderSubbar() {
  const rm = activeRoom();
  const sub = document.getElementById('stageSubbar');
  if (state.mode === 'house') {
    sub.innerHTML = `
      <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:11px;color:var(--muted);font-weight:700;margin-right:4px;">CANVAS TOOLS:</span>
        <button class="pill-btn ${state.planTool==='select'?'active':''}" style="border:1px solid var(--border);" onclick="state.planTool='select';renderAll()">👆 Select / Elev Scope</button>
        <button class="pill-btn ${state.planTool==='draw_line'?'active':''}" style="border:1px solid var(--border);" onclick="state.planTool='draw_line';renderAll()">✏️ Draw Intent Line</button>
        <button class="pill-btn ${state.planTool==='section_cut'?'active':''}" style="border:1px solid var(--border);" onclick="state.planTool='section_cut';renderAll()">✂️ Place Section Cut</button>
        ${MATRIX.drawnLines.length ? `<button class="chip-btn" onclick="MATRIX.drawnLines.pop();renderAll()">↶ Undo Line (${MATRIX.drawnLines.length})</button>` : ''}
      </div>
      <div style="display:flex;gap:4px;">
        <button class="chip-btn" onclick="state.zoom=Math.max(0.6,state.zoom-0.2);renderStage()">−</button>
        <button class="chip-btn" onclick="state.zoom=1;state.panX=0;state.panY=0;renderStage()">Fit</button>
        <button class="chip-btn" onclick="state.zoom=Math.min(3.0,state.zoom+0.2);renderStage()">+</button>
      </div>`;
  } else {
    const w = activeWall();
    sub.innerHTML = `
      <div style="display:flex;gap:5px;overflow-x:auto;align-items:center;">
        <button class="chip-btn" onclick="toggleHouseMode()">← House Plan</button>
        ${rm.walls.map(wl => `
          <button class="pill-btn ${wl.id === w.id ? 'active' : ''}" style="border:1px solid var(--border);" onclick="state.wallId='${wl.id}';state.bayIdx=0;renderAll()">
            ${wl.elevOnSheet ? '◁ ' : ''}${wl.shortLabel} · ${fmtFtIn(wl.clearWidthIn)}
          </button>`).join('')}
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;">
        <button class="chip-btn on" onclick="splitSelectedBay()">✂️ + Split Vertical Bay</button>
        <button class="chip-btn" style="border-color:var(--gold);color:var(--gold-lt);" onclick="addHorizontalLevel()">+ Add Horiz Level</button>
        <button class="chip-btn" onclick="toggleWallElevScope('${w.id}')">${w.elevOnSheet ? '◁ On Sheet: YES' : 'Off Sheet'}</button>
      </div>`;
  }
}

function renderStage() {
  const svg = document.getElementById('stageSvg');
  const card = document.getElementById('floatRoomCard');
  const isBp = state.theme === 'blueprint';
  const bg = isBp ? '#09111f' : '#f7f5ef';
  const wallCol = isBp ? '#e2e8f0' : '#0f172a';
  const roomFill = isBp ? '#132038' : '#ffffff';
  const selFill = isBp ? 'rgba(234,179,8,0.22)' : 'rgba(234,179,8,0.16)';
  const txtMain = isBp ? '#f8fafc' : '#0f172a';
  const txtSub = isBp ? '#94a3b8' : '#475569';
  svg.style.background = bg;

  if (state.mode === 'house') {
    const lrms = levelRooms();
    const ozs = (MATRIX.outdoorZones || []).filter(z => z.level === state.level);
    const vzs = (MATRIX.voidZones || []).filter(z => z.level === state.level);
    const rects = lrms.map(r => ({ r, rc: getEffRect(r) }));
    const allB = [...rects.map(x => x.rc), ...ozs, ...vzs];
    const minX = Math.min(...allB.map(b => b.xIn)) - 54;
    const minY = Math.min(...allB.map(b => b.yIn)) - 54;
    const maxX = Math.max(...allB.map(b => b.xIn + b.widthIn)) + 54;
    const maxY = Math.max(...allB.map(b => b.yIn + b.depthIn)) + 84;
    const baseW = maxX - minX, baseH = maxY - minY;
    const vw = baseW / state.zoom, vh = baseH / state.zoom;
    const vx = minX + (baseW - vw) / 2 - state.panX;
    const vy = minY + (baseH - vh) / 2 - state.panY;
    svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);

    let h = `<defs>
      <pattern id="g60" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="${isBp ? 'rgba(148,163,184,0.08)' : 'rgba(15,23,42,0.07)'}" stroke-width="1"/>
      </pattern>
    </defs>
    <rect x="${minX-500}" y="${minY-500}" width="${baseW+1000}" height="${baseH+1000}" fill="url(#g60)"/>`;

    // Red Dashed Structural Column Grids (From A104)!
    if (state.showGrids && MATRIX.structuralGrids) {
      MATRIX.structuralGrids.xIn.forEach((gx, idx) => {
        h += `<line x1="${gx}" y1="${minY+10}" x2="${gx}" y2="${maxY-40}" stroke="rgba(244,63,94,0.42)" stroke-width="1.4" stroke-dasharray="8 6"/>
              <circle cx="${gx}" cy="${minY+24}" r="11" fill="rgba(244,63,94,0.18)" stroke="#fb7185" stroke-width="1.3"/>
              <text x="${gx}" y="${minY+28}" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="700">${idx+1}</text>`;
      });
      ['B','C','D'].forEach((glbl, idx) => {
        const gy = MATRIX.structuralGrids.yIn[idx];
        h += `<line x1="${minX+15}" y1="${gy}" x2="${maxX-15}" y2="${gy}" stroke="rgba(244,63,94,0.42)" stroke-width="1.4" stroke-dasharray="8 6"/>
              <circle cx="${minX+28}" cy="${gy}" r="11" fill="rgba(244,63,94,0.18)" stroke="#fb7185" stroke-width="1.3"/>
              <text x="${minX+28}" y="${gy+4}" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="700">${glbl}</text>`;
      });
    }

    // Outdoor zones
    ozs.forEach(oz => {
      h += `<rect x="${oz.xIn}" y="${oz.yIn}" width="${oz.widthIn}" height="${oz.depthIn}" fill="${isBp?'rgba(30,41,59,0.36)':'rgba(226,232,240,0.45)'}" stroke="${txtSub}" stroke-width="2" stroke-dasharray="10 7"/>
      <text x="${oz.xIn+oz.widthIn/2}" y="${oz.yIn+oz.depthIn/2}" text-anchor="middle" fill="${txtSub}" font-size="12.5" font-weight="600">${oz.label}</text>`;
    });

    // Voids
    vzs.forEach(vz => {
      h += `<rect x="${vz.xIn}" y="${vz.yIn}" width="${vz.widthIn}" height="${vz.depthIn}" fill="rgba(8,14,26,0.5)" stroke="${txtSub}" stroke-width="2" stroke-dasharray="6 5"/>
      <line x1="${vz.xIn}" y1="${vz.yIn}" x2="${vz.xIn+vz.widthIn}" y2="${vz.yIn+vz.depthIn}" stroke="${txtSub}" stroke-width="1" opacity="0.45"/>
      <line x1="${vz.xIn+vz.widthIn}" y1="${vz.yIn}" x2="${vz.xIn}" y2="${vz.yIn+vz.depthIn}" stroke="${txtSub}" stroke-width="1" opacity="0.45"/>
      <text x="${vz.xIn+vz.widthIn/2}" y="${vz.yIn+vz.depthIn/2}" text-anchor="middle" fill="${txtSub}" font-size="12" font-weight="700">${vz.label}</text>`;
    });

    // Conditioned rooms + Active Interior Elevation Callout Triangles!
    rects.forEach(({ r, rc }) => {
      const sel = r.id === state.roomId;
      const cx = rc.xIn + rc.widthIn / 2, cy = rc.yIn + rc.depthIn / 2;
      const small = rc.widthIn < 88 || rc.depthIn < 66;
      h += `<g data-click="1" onclick="selectRoom('${r.id}', false)" ondblclick="selectRoom('${r.id}', true)" style="cursor:${state.planTool==='select'?'pointer':'crosshair'};">
        <rect x="${rc.xIn}" y="${rc.yIn}" width="${rc.widthIn}" height="${rc.depthIn}" fill="${sel ? selFill : roomFill}" stroke="${sel ? '#eab308' : wallCol}" stroke-width="${sel ? 5 : 3.2}"/>`;
      if (r.island) {
        h += `<rect x="${cx - r.island.widthIn/2}" y="${cy - r.island.depthIn/2 + 8}" width="${r.island.widthIn}" height="${r.island.depthIn}" fill="rgba(56,189,248,0.16)" stroke="${wallCol}" stroke-width="1.8"/>`;
      }
      // Interior Elevation Callout Triangles on active walls!
      if (!small) {
        r.walls.forEach(wl => {
          if (!wl.elevOnSheet) return;
          const colE = sel ? '#fde047' : '#38bdf8';
          if (wl.id === 'N') h += `<polygon points="${cx},${rc.yIn+7} ${cx-7},${rc.yIn+17} ${cx+7},${rc.yIn+17}" fill="${colE}"/>`;
          if (wl.id === 'S') h += `<polygon points="${cx},${rc.yIn+rc.depthIn-7} ${cx-7},${rc.yIn+rc.depthIn-17} ${cx+7},${rc.yIn+rc.depthIn-17}" fill="${colE}"/>`;
          if (wl.id === 'W') h += `<polygon points="${rc.xIn+7},${cy} ${rc.xIn+17},${cy-7} ${rc.xIn+17},${cy+7}" fill="${colE}"/>`;
          if (wl.id === 'E') h += `<polygon points="${rc.xIn+rc.widthIn-7},${cy} ${rc.xIn+rc.widthIn-17},${cy-7} ${rc.xIn+rc.widthIn-17},${cy+7}" fill="${colE}"/>`;
        });
      }
      h += `<text x="${cx}" y="${cy - (small ? 1 : 6)}" text-anchor="middle" fill="${txtMain}" font-size="${small ? 10 : 13}" font-weight="700">${r.number} ${r.name}</text>`;
      if (!small) {
        h += `<text x="${cx}" y="${cy + 11}" text-anchor="middle" fill="${txtSub}" font-size="10" font-family="monospace">${fmtFtIn(rc.widthIn)} × ${fmtFtIn(rc.depthIn)}</text>`;
      }
      h += `</g>`;
    });

    // D1 Intent Lines (Soft Dashed Cyan = Intent, NOT exact fabrication cut!)
    if (state.showNotes && MATRIX.d1Lines) {
      MATRIX.d1Lines.filter(ln => ln.level === state.level).forEach(ln => {
        const isRm = ln.roomId === state.roomId;
        h += `<line x1="${ln.p1In[0]}" y1="${ln.p1In[1]}" x2="${ln.p2In[0]}" y2="${ln.p2In[1]}" stroke="${isRm ? '#00e0ff' : '#38bdf8'}" stroke-width="${isRm ? 2.4 : 1.5}" stroke-dasharray="5 3" opacity="${isRm ? 0.95 : 0.6}"/>`;
      });
    }

    // User-Drawn Live Canvas Intent Lines (Bright Gold Solid!)
    (MATRIX.drawnLines || []).filter(ln => ln.level === state.level).forEach(ln => {
      const len = Math.hypot(ln.x2 - ln.x1, ln.y2 - ln.y1);
      h += `<line x1="${ln.x1}" y1="${ln.y1}" x2="${ln.x2}" y2="${ln.y2}" stroke="#fde047" stroke-width="4" stroke-linecap="round"/>
            <text x="${(ln.x1+ln.x2)/2}" y="${(ln.y1+ln.y2)/2 - 6}" text-anchor="middle" fill="#fde047" font-size="10" font-weight="700" font-family="monospace">${fmtFtIn(len)}</text>`;
    });

    // Building / Wall Section Cuts (A—A)!
    (MATRIX.sectionCuts || []).filter(sc => sc.level === state.level).forEach(sc => {
      h += `<line x1="${sc.x1}" y1="${sc.y1}" x2="${sc.x2}" y2="${sc.y2}" stroke="#f59e0b" stroke-width="2.6" stroke-dasharray="14 6 4 6"/>
            <circle cx="${sc.x1}" cy="${sc.y1}" r="13" fill="#eab308" stroke="#080d16" stroke-width="2"/>
            <text x="${sc.x1}" y="${sc.y1+4}" text-anchor="middle" fill="#080d16" font-size="11" font-weight="800">${sc.label}</text>
            <circle cx="${sc.x2}" cy="${sc.y2}" r="13" fill="#eab308" stroke="#080d16" stroke-width="2"/>
            <text x="${sc.x2}" y="${sc.y2+4}" text-anchor="middle" fill="#080d16" font-size="11" font-weight="800">${sc.label}</text>`;
    });

    // Live rubber-band preview while drawing on plan!
    if (state.draftDrag && (state.draftDrag.kind === 'draw_line' || state.draftDrag.kind === 'section_cut')) {
      const dd = state.draftDrag;
      const len = Math.hypot(dd.x2 - dd.x1, dd.y2 - dd.y1);
      h += `<line x1="${dd.x1}" y1="${dd.y1}" x2="${dd.x2}" y2="${dd.y2}" stroke="#00e0ff" stroke-width="4" stroke-dasharray="6 4"/>
            <text x="${(dd.x1+dd.x2)/2}" y="${(dd.y1+dd.y2)/2 - 8}" text-anchor="middle" fill="#00e0ff" font-size="12" font-weight="700">${fmtFtIn(len)}</text>`;
    }

    svg.innerHTML = h;

    const rm = activeRoom();
    const rc = getEffRect(rm);
    const elevWalls = rm.walls.filter(w => w.elevOnSheet).map(w => w.id).join(', ') || 'None';
    card.style.display = 'flex';
    card.innerHTML = `
      <div>
        <div style="display:flex;align-items:center;gap:7px;">
          <span class="badge" style="background:rgba(234,179,8,0.22);color:var(--gold-lt);">${rm.number}</span>
          <strong style="font-size:15px;">${rm.name}</strong>
          <span style="font-family:monospace;font-size:12px;color:var(--cyan);">${fmtFtIn(rc.widthIn)} × ${fmtFtIn(rc.depthIn)}</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">Sheet Interior Elevs: <b style="color:var(--gold-lt);">◁ ${elevWalls}</b> · Tap walls in Studio to toggle</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="chip-btn gold" onclick="selectRoom('${rm.id}', true)">Edit Levels &amp; Bays →</button>
      </div>`;
  } else {
    // =========================================================================
    // ROOM ELEVATION STUDIO WITH DRAGGABLE HORIZONTAL LEVELS & VERTICAL BAYS!
    // =========================================================================
    card.style.display = 'none';
    const rm = activeRoom();
    const w = activeWall();
    const W = w.clearWidthIn, H = w.ceilingHeightIn || 120;
    const padL = 56, padR = 92, padT = 38, padB = 56;
    const totW = W + padL + padR, totH = H + padT + padB;
    const vw = totW / state.zoom, vh = totH / state.zoom;
    const vx = -padL + (totW - vw) / 2 - state.panX;
    const vy = -padT + (totH - vh) / 2 - state.panY;
    svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);

    const totalBayW = w.bays.reduce((s, b) => s + b.widthIn, 0);
    const leftScribe = Math.max(0, snapHalf((W - totalBayW) / 2));
    const rightScribe = Math.max(0, snapHalf(W - totalBayW - leftScribe));
    let curX = leftScribe;

    let h = `<text x="0" y="-18" fill="${txtMain}" font-size="9.5" font-weight="700" font-family="monospace">${rm.number} ${rm.name.toUpperCase()} — ${w.shortLabel} WALL (${fmtFtIn(W)} CLEAR · DRAG HORIZONTAL LEVELS ↕ OR VERTICAL BAY HANDLES ◆ ↔)</text>
    <rect x="0" y="0" width="${W}" height="${H}" fill="${isBp ? '#0e1a2f' : '#ffffff'}" stroke="${wallCol}" stroke-width="2.6"/>`;

    // Left & Right Symmetrical Scribe Zones (Deubner Rule: <= 6" symmetrical scribes!)
    if (leftScribe > 0 && w.bays.length > 0) {
      h += `<rect x="0" y="0" width="${leftScribe}" height="${H}" fill="rgba(148,163,184,0.06)"/>
            <text x="${leftScribe/2}" y="${H + 14}" text-anchor="middle" fill="${leftScribe<=6?'#6ee7b7':'#fcd34d'}" font-size="6.5" font-family="monospace">${leftScribe}" SCRIBE</text>`;
    }
    if (rightScribe > 0 && w.bays.length > 0) {
      h += `<rect x="${W - rightScribe}" y="0" width="${rightScribe}" height="${H}" fill="rgba(148,163,184,0.06)"/>
            <text x="${W - rightScribe/2}" y="${H + 14}" text-anchor="middle" fill="${rightScribe<=6?'#6ee7b7':'#fcd34d'}" font-size="6.5" font-family="monospace">${rightScribe}" SCRIBE</text>`;
    }

    // Bays + Interactive Vertical Bay Dividers (◆ Drag Left/Right!)
    const dividerXs = [];
    w.bays.forEach((b, idx) => {
      const bx = curX, bw = b.widthIn, bh = Math.min(H, b.heightIn || 36);
      const by = H - bh - (b.affIn || 0);
      const isSel = idx === state.bayIdx;
      h += `<g data-click="1" onclick="state.bayIdx=${idx};renderAll()" style="cursor:pointer;">
        <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${isSel ? 'rgba(0,224,255,0.2)' : 'rgba(234,179,8,0.14)'}" stroke="${isSel ? '#00e0ff' : wallCol}" stroke-width="${isSel ? 2.2 : 1.5}"/>
        <line x1="${bx+2}" y1="${by+3.5}" x2="${bx+bw-2}" y2="${by+3.5}" stroke="${wallCol}" stroke-width="0.9"/>
        <text x="${bx + bw/2}" y="${by + bh/2 - 2}" text-anchor="middle" fill="${txtMain}" font-size="6.8" font-weight="700">${b.label.slice(0, 22)}</text>
        <text x="${bx + bw/2}" y="${by + bh/2 + 7}" text-anchor="middle" fill="${txtSub}" font-size="6.2" font-family="monospace">${fmtFtIn(bw)} × ${fmtFtIn(bh)}</text>
      </g>`;
      h += `<line x1="${bx}" y1="${H + 18}" x2="${bx + bw}" y2="${H + 18}" stroke="#38bdf8" stroke-width="1"/>
            <text x="${bx + bw/2}" y="${H + 27}" text-anchor="middle" fill="#7dd3fc" font-size="7" font-weight="700" font-family="monospace">${fmtFtIn(bw)}</text>`;
      curX += bw;
      if (idx < w.bays.length - 1) dividerXs.push({ idx, x: curX });
    });

    // Render Draggable Vertical Bay Divider Handles (◆)
    dividerXs.forEach(dv => {
      h += `<g data-divider-idx="${dv.idx}" style="cursor:ew-resize;">
        <line x1="${dv.x}" y1="4" x2="${dv.x}" y2="${H + 16}" stroke="#00e0ff" stroke-width="1.6" stroke-dasharray="3 2"/>
        <polygon points="${dv.x},${H/2 - 6} ${dv.x + 5},${H/2} ${dv.x},${H/2 + 6} ${dv.x - 5},${H/2}" fill="#00e0ff" stroke="#080d16" stroke-width="1.2"/>
        <rect x="${dv.x - 10}" y="0" width="20" height="${H}" fill="transparent"/>
      </g>`;
    });

    // Render Draggable Horizontal Levels (Datums — Drag Up/Down ↕!)
    (rm.datums || []).forEach((d, dIdx) => {
      const dy = H - d.affIn;
      if (dy < 0 || dy > H) return;
      const colD = d.affIn >= 96 ? '#eab308' : (d.affIn === 36 ? '#38bdf8' : '#a78bfa');
      h += `<g data-datum-idx="${dIdx}" style="cursor:ns-resize;">
        <line x1="-14" y1="${dy}" x2="${W + 14}" y2="${dy}" stroke="${colD}" stroke-width="1.3" stroke-dasharray="5 3"/>
        <rect x="${W + 14}" y="${dy - 6.5}" width="72" height="13" rx="3" fill="rgba(16,24,39,0.94)" stroke="${colD}" stroke-width="1"/>
        <text x="${W + 18}" y="${dy + 2.5}" fill="${colD}" font-size="6.4" font-weight="700" font-family="monospace">↕ ${d.label.slice(0, 16)}</text>
        <rect x="-14" y="${dy - 6}" width="${W + 100}" height="12" fill="transparent"/>
      </g>`;
    });

    // Overall Clear Wall Dimension
    h += `<line x1="0" y1="${H + 38}" x2="${W}" y2="${H + 38}" stroke="${wallCol}" stroke-width="1.3"/>
          <text x="${W/2}" y="${H + 48}" text-anchor="middle" fill="${txtMain}" font-size="8.2" font-weight="700" font-family="monospace">${fmtFtIn(W)} CLEAR WALL</text>`;
    svg.innerHTML = h;
  }
}

function renderInspector() {
  const rm = activeRoom();
  const w = activeWall();
  const trRoom = (MATRIX.transcriptByRoom || {})[rm.id] || { decisions: [] };
  const d1Renders = (MATRIX.d1EnhancedRenders || []).filter(r => r.rooms.includes(rm.id) || r.rooms.includes('HOUSE'));
  const clientThumbs = (MATRIX.clientInspoThumbs || {})[rm.id] || [];
  const roomNotes = (MATRIX.d1Notes || []).filter(n => n.targetRoomId === rm.id);

  let html = `
    <!-- 1. VISUAL INSPIRATIONS: DRAFT 1 ENHANCED RENDERS + CLIENT FOLDER PHOTOS -->
    <div class="bay-card" style="border-color:rgba(234,179,8,0.45);">
      <div class="sec-lbl" style="color:var(--gold-lt);">🖼️ Visual Inspirations (D1 Enhanced Renders + Client Folder)</div>
      <div class="thumb-grid">
        ${clientThumbs.map((uri, i) => `
          <div class="thumb-item" onclick="openLightbox('${uri}', 'Client Folder Inspo — Room ${rm.number}')">
            <img src="${uri}" alt="Client Inspo" />
            <div class="thumb-cap">📁 Client Inspo #${i+1}</div>
          </div>`).join('')}
        ${d1Renders.slice(0, 4 - Math.min(2, clientThumbs.length)).map(dr => `
          <div class="thumb-item" onclick="openLightbox('${dr.dataUri}', '${dr.label}')">
            <img src="${dr.dataUri}" alt="${dr.label}" />
            <div class="thumb-cap">✨ ${dr.label}</div>
          </div>`).join('')}
      </div>
    </div>

    <!-- 2. HORIZONTAL LEVELS & VERTICAL BAYS SUMMARY (Deubner Rules) -->
    <div class="bay-card" style="border-color:rgba(0,224,255,0.4);">
      <div class="sec-lbl" style="color:var(--cyan);">📐 Barnhaus Levels &amp; Vertical Bays (${w.shortLabel} Wall)</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">
        Drag <b>↕ Levels</b> up/down or <b>◆ Bay Handles</b> left/right directly on the elevation (Deubner modular rules active):
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;">
        ${(rm.datums || []).map(d => `<span class="badge" style="background:rgba(167,139,250,0.16);color:#ddd6fe;">↕ ${d.label}</span>`).join('')}
      </div>
      ${w.bays.map((b, idx) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-radius:5px;background:var(--bg);margin-bottom:4px;border:1px solid ${idx===state.bayIdx?'var(--cyan)':'var(--border)'};">
          <span style="font-size:11.5px;font-weight:600;">#${idx+1} ${b.label}</span>
          <span style="font-family:monospace;font-size:11.5px;color:var(--cyan);">${fmtFtIn(b.widthIn)} × ${fmtFtIn(b.heightIn)}</span>
        </div>`).join('')}
    </div>

    <!-- 3. ORGANIZED ROOM TRANSCRIPT POINTS (Only What We Pull From Mitch's Intake!) -->
    ${trRoom.decisions.length > 0 ? `
    <div>
      <div class="sec-lbl" style="color:#c084fc;">🎙️ Transcript Design Points (${trRoom.decisions.length})</div>
      ${trRoom.decisions.slice(0, 5).map(d => `
        <div class="note-card" style="border-color:rgba(192,132,252,0.32);">
          <div style="font-size:10px;color:#d8b4fe;font-weight:700;text-transform:uppercase;">${d.topic} ${d.meeting ? '· ' + d.meeting : ''}</div>
          <div style="font-size:11.5px;color:var(--text);margin-top:2px;">${d.value}</div>
        </div>`).join('')}
    </div>` : ''}

    <!-- 4. D1 ARROW-TARGETED PLAN NOTES -->
    ${roomNotes.length > 0 ? `
    <div>
      <div class="sec-lbl" style="color:#6ee7b7;">📝 D1 Plan Intent Notes (${roomNotes.length})</div>
      ${roomNotes.map(n => `<div class="note-card"><strong style="color:#f8fafc;">"${n.text}"</strong> <span class="badge" style="background:rgba(16,185,129,0.16);color:#6ee7b7;margin-left:4px;">${n.wallFace || ''}</span></div>`).join('')}
    </div>` : ''}
  `;
  document.getElementById('rightInspector').innerHTML = html;
}

renderAll();
</script>
</body>
</html>
