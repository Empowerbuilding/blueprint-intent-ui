<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Barnhaus Design Canvas — Instant Sandbox Studio</title>
<style>
  :root {
    --bg: #080d16;
    --panel: #101827;
    --card: #172236;
    --border: #263652;
    --gold: #eab308;
    --gold-lt: #fde047;
    --cyan: #00e0ff;
    --emerald: #10b981;
    --amber: #f59e0b;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, select { font: inherit; cursor: pointer; }
  .app { display: flex; flex-direction: column; height: 100dvh; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); z-index: 10; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .brand-dot { width: 10px; height: 10px; border-radius: 2px; background: var(--gold); }
  .pill-group { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
  .pill-btn { border: 0; background: transparent; color: var(--muted); padding: 6px 11px; border-radius: 6px; font-size: 12px; font-weight: 600; min-height: 32px; }
  .pill-btn.active { background: var(--gold); color: #090d16; font-weight: 700; }
  .chip-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; min-height: 34px; }
  .chip-btn.on { border-color: #0284c7; background: rgba(2,132,199,0.22); color: #7dd3fc; }
  .chip-btn.notes-on { border-color: var(--emerald); background: rgba(16,185,129,0.18); color: #6ee7b7; }
  .chip-btn.gold { border-color: var(--gold); background: var(--gold); color: #090d16; font-weight: 700; }

  .mob-tabs { display: none; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px 10px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .mob-tab { border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 8px; min-height: 40px; font-size: 12px; font-weight: 700; padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mob-tab.active { background: var(--gold); color: #090d16; border-color: var(--gold); }

  .body { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .left-pane { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 10px; gap: 8px; }
  .center-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .right-pane { width: 330px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 12px; gap: 12px; }

  .subbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .stage-wrap { flex: 1; position: relative; min-height: 0; overflow: hidden; touch-action: none; user-select: none; }
  .stage-svg { width: 100%; height: 100%; display: block; }

  .float-card { position: absolute; left: 12px; right: 12px; bottom: 12px; max-width: 620px; margin-left: auto; background: rgba(16,24,39,0.95); border: 1px solid rgba(234,179,8,0.55); border-radius: 12px; padding: 10px 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); backdrop-filter: blur(8px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .room-row { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); margin-bottom: 5px; }
  .room-row.active { border-color: var(--cyan); background: rgba(0,224,255,0.12); }
  .sec-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .note-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 9px; font-size: 12px; margin-bottom: 6px; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; font-family: ui-monospace, monospace; }
  .badge-ldr { background: rgba(16,185,129,0.2); color: #6ee7b7; }
  .badge-ret { background: rgba(245,158,11,0.22); color: #fcd34d; }
  .bay-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 9px; font-size: 12px; }

  @media (max-width: 1023px) {
    .mob-tabs { display: grid; }
    .left-pane, .right-pane, .center-pane { display: none; width: 100%; border: 0; }
    .body[data-mob="house"] .center-pane,
    .body[data-mob="room"] .center-pane { display: flex; }
    .body[data-mob="notes"] .right-pane { display: flex; }
    .hide-mob { display: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="brand"><span class="brand-dot"></span>Barnhaus Canvas <span style="font-size:11px;color:var(--emerald);font-weight:600;">⚡ 0ms Local</span></div>
      <div class="pill-group" id="floorPills">
        <button class="pill-btn active" onclick="setLevel(1)">L1 · Main</button>
        <button class="pill-btn" onclick="setLevel(2)">L2 · Upper</button>
      </div>
      <button class="chip-btn gold" id="btnHouseMode" onclick="toggleHouseMode()">🏠 Whole House</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <button class="chip-btn notes-on" id="btnNotes" onclick="toggleNotes()">📝 D1 Notes + Arrows: ON</button>
      <button class="chip-btn" id="btnTheme" onclick="toggleTheme()">CAD: Blueprint</button>
      <button class="chip-btn hide-mob" onclick="exportJson()">Export JSON</button>
    </div>
  </div>

  <!-- MOBILE 3-TAB BAR -->
  <div class="mob-tabs">
    <button class="mob-tab active" id="mtab-house" onclick="setMobTab('house')">🏠 House Plan</button>
    <button class="mob-tab" id="mtab-room" onclick="setMobTab('room')">📐 Room Elev</button>
    <button class="mob-tab" id="mtab-notes" onclick="setMobTab('notes')">📝 Notes &amp; Bays</button>
  </div>

  <!-- MAIN STUDIO BODY -->
  <div class="body" id="studioBody" data-mob="house">
    <!-- LEFT: ROOMS LIST (Desktop) -->
    <aside class="left-pane" id="leftRoomList"></aside>

    <!-- CENTER: INTERACTIVE SVG STAGE -->
    <main class="center-pane">
      <div class="subbar" id="stageSubbar"></div>
      <div class="stage-wrap" id="stageWrap">
        <svg class="stage-svg" id="stageSvg"></svg>
        <div class="float-card" id="floatRoomCard"></div>
      </div>
    </main>

    <!-- RIGHT: D1 LEADER-TARGETED NOTES + PARAMETRIC BAYS -->
    <aside class="right-pane" id="rightInspector"></aside>
  </div>
</div>

let state = {
  level: 1,
  mode: 'house', // 'house' | 'room'
  mobTab: 'house',
  roomId: '106',
  wallId: 'S',
  bayIdx: 0,
  showNotes: true,
  theme: 'blueprint', // 'blueprint' | 'paper'
  zoom: 1,
  panX: 0,
  panY: 0,
  selectedNoteId: null
};

function fmtFtIn(inc) {
  const v = Math.round(Math.abs(inc) * 2) / 2;
  const ft = Math.floor(v / 12);
  const rem = v - ft * 12;
  const ri = Math.floor(rem);
  const hf = Math.abs(rem - ri - 0.5) < 0.01 ? ' 1/2' : '';
  return `${ft}'-${ri}${hf}"`;
}

function getEffRect(rm) {
  const r = { ...rm.planRect };
  if (rm.flexPlanBinding) {
    const fw = MATRIX.flexWalls[rm.flexPlanBinding.flexWallId];
    if (fw && fw.nudgeIn) {
      if (rm.flexPlanBinding.role === 'expand_east') r.widthIn += fw.nudgeIn;
      else if (rm.flexPlanBinding.role === 'shift_west') { r.xIn += fw.nudgeIn; r.widthIn -= fw.nudgeIn; }
    }
  }
  return r;
}

function levelRooms() {
  return MATRIX.rooms.filter(r => (r.level || 1) === state.level);
}
function activeRoom() {
  return MATRIX.rooms.find(r => r.id === state.roomId) || levelRooms()[0];
}
function activeWall() {
  const rm = activeRoom();
  return rm.walls.find(w => w.id === state.wallId) || rm.walls[0];
}

function setLevel(lvl) {
  state.level = lvl;
  const r0 = levelRooms()[0];
  if (r0 && (activeRoom().level || 1) !== lvl) {
    state.roomId = r0.id;
    const w0 = r0.walls.find(w => w.bays.length > 0) || r0.walls[0];
    state.wallId = w0.id;
    state.bayIdx = 0;
  }
  state.zoom = 1; state.panX = 0; state.panY = 0;
  renderAll();
}

function toggleHouseMode() {
  if (state.mode === 'house') {
    state.mode = 'room';
    state.mobTab = 'room';
  } else {
    state.mode = 'house';
    state.mobTab = 'house';
  }
  state.zoom = 1; state.panX = 0; state.panY = 0;
  renderAll();
}

function setMobTab(tab) {
  state.mobTab = tab;
  if (tab === 'house') state.mode = 'house';
  if (tab === 'room') state.mode = 'room';
  state.zoom = 1; state.panX = 0; state.panY = 0;
  renderAll();
}

function selectRoom(rid, enterStudio = false) {
  const rm = MATRIX.rooms.find(r => r.id === rid);
  if (!rm) return;
  state.level = rm.level || 1;
  state.roomId = rid;
  const w0 = rm.walls.find(w => w.bays.length > 0) || rm.walls[0];
  state.wallId = w0.id;
  state.bayIdx = 0;
  if (enterStudio) {
    state.mode = 'room';
    state.mobTab = 'room';
    state.zoom = 1; state.panX = 0; state.panY = 0;
  }
  renderAll();
}

function toggleNotes() { state.showNotes = !state.showNotes; renderAll(); }
function toggleTheme() { state.theme = state.theme === 'blueprint' ? 'paper' : 'blueprint'; renderAll(); }

function nudgeFlex(fid, delta) {
  const fw = MATRIX.flexWalls[fid];
  if (!fw) return;
  fw.nudgeIn = Math.max(-fw.maxNudgeIn, Math.min(fw.maxNudgeIn, fw.nudgeIn + delta));
  renderAll();
}

function reassignNote(noteId, newRoomId) {
  const n = (MATRIX.d1Notes || []).find(x => x.id === noteId);
  const rm = MATRIX.rooms.find(r => r.id === newRoomId);
  if (!n || !rm) return;
  n.targetRoomId = rm.id;
  n.targetRoomName = rm.name;
  n.method = 'manual_designer_lock';
  n.confidence = 'high';
  renderAll();
}

function adjustBayWidth(idx, delta) {
  const w = activeWall();
  if (!w.bays[idx]) return;
  w.bays[idx].widthIn = Math.max(12, w.bays[idx].widthIn + delta);
  renderAll();
}

function exportJson() {
  const blob = new Blob([JSON.stringify(MATRIX, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'barnhaus-sandbox-matrix-updated.json';
  a.click();
}

// Touch / Mouse Drag Pan & Wheel Zoom
(function initPanZoom() {
  const wrap = document.getElementById('stageWrap');
  let drag = null;
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    state.zoom = Math.max(0.6, Math.min(3.2, +(state.zoom + (e.deltaY < 0 ? 0.14 : -0.14)).toFixed(2)));
    renderStage();
  }, { passive: false });
  wrap.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-click="1"]') || e.target.closest('.float-card')) return;
    drag = { sx: e.clientX, sy: e.clientY, px: state.panX, py: state.panY };
  });
  wrap.addEventListener('pointermove', e => {
    if (!drag) return;
    state.panX = drag.px + (e.clientX - drag.sx) / state.zoom;
    state.panY = drag.py + (e.clientY - drag.sy) / state.zoom;
    renderStage();
  });
  window.addEventListener('pointerup', () => { drag = null; });
})();

function renderAll() {
  // Update top pills
  const fp = document.getElementById('floorPills').children;
  fp[0].className = 'pill-btn' + (state.level === 1 ? ' active' : '');
  fp[1].className = 'pill-btn' + (state.level === 2 ? ' active' : '');

  const bh = document.getElementById('btnHouseMode');
  bh.textContent = state.mode === 'house' ? '🏠 Whole House (Active)' : '← Whole House Plan';
  bh.className = 'chip-btn' + (state.mode === 'house' ? ' gold' : '');

  const bn = document.getElementById('btnNotes');
  bn.textContent = `📝 D1 Notes + Arrows: ${state.showNotes ? 'ON' : 'OFF'}`;
  bn.className = 'chip-btn' + (state.showNotes ? ' notes-on' : '');

  document.getElementById('btnTheme').textContent = `CAD: ${state.theme === 'blueprint' ? 'Dark Blueprint' : 'Paper'}`;

  const rm = activeRoom();
  document.getElementById('studioBody').dataset.mob = state.mobTab;
  document.getElementById('mtab-house').className = 'mob-tab' + (state.mobTab === 'house' ? ' active' : '');
  document.getElementById('mtab-house').textContent = `🏠 House (L${state.level})`;
  document.getElementById('mtab-room').className = 'mob-tab' + (state.mobTab === 'room' ? ' active' : '');
  document.getElementById('mtab-room').textContent = `📐 ${rm.number} ${rm.name}`;
  const roomNotes = (MATRIX.d1Notes || []).filter(n => n.targetRoomId === rm.id);
  document.getElementById('mtab-notes').className = 'mob-tab' + (state.mobTab === 'notes' ? ' active' : '');
  document.getElementById('mtab-notes').textContent = `📝 Notes (${roomNotes.length}) & Bays`;

  // Left room list
  const lrms = levelRooms();
  document.getElementById('leftRoomList').innerHTML =
    `<div class="sec-lbl">Level ${state.level} Rooms (${lrms.length}) — Double-Click for Elev</div>` +
    lrms.map(r => {
      const rc = getEffRect(r);
      const ncnt = (MATRIX.d1Notes || []).filter(n => n.targetRoomId === r.id).length;
      return `<button class="room-row ${r.id === rm.id ? 'active' : ''}" onclick="selectRoom('${r.id}', false)" ondblclick="selectRoom('${r.id}', true)">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;">
          <span><span style="color:var(--muted);font-family:monospace;">${r.number}</span> ${r.name}</span>
          <span style="font-family:monospace;font-size:11px;color:var(--cyan);">${fmtFtIn(rc.widthIn)}×${fmtFtIn(rc.depthIn)}</span>
        </div>
        <div style="font-size:10.5px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:175px;">${r.subtitle}</span>
          ${ncnt ? `<span style="color:#6ee7b7;">${ncnt} notes</span>` : ''}
        </div>
      </button>`;
    }).join('');

  renderSubbar();
  renderStage();
  renderInspector();
}

function renderSubbar() {
  const rm = activeRoom();
  const sub = document.getElementById('stageSubbar');
  if (state.mode === 'house') {
    const lvlNotes = (MATRIX.d1Notes || []).filter(n => n.level === state.level);
    const crossCnt = lvlNotes.filter(n => n.textBoxRoom !== n.targetRoomId).length;
    sub.innerHTML = `
      <div style="font-size:12px;color:var(--muted);">
        <strong style="color:var(--gold-lt);">Level ${state.level} Interactive Floor Plan</strong> · Tap room to select · Double-tap or hit <b>Open Room Studio →</b> · <span style="color:#6ee7b7;">${crossCnt} cross-room arrow notes auto-linked</span>
      </div>
      <div style="display:flex;gap:4px;">
        <button class="chip-btn" onclick="state.zoom=Math.max(0.6,state.zoom-0.2);renderStage()">−</button>
        <button class="chip-btn" onclick="state.zoom=1;state.panX=0;state.panY=0;renderStage()">Fit (${Math.round(state.zoom*100)}%)</button>
        <button class="chip-btn" onclick="state.zoom=Math.min(3.0,state.zoom+0.2);renderStage()">+</button>
      </div>`;
  } else {
    const w = activeWall();
    sub.innerHTML = `
      <div style="display:flex;gap:5px;overflow-x:auto;align-items:center;">
        <button class="chip-btn" onclick="toggleHouseMode()">← House Plan</button>
        ${rm.walls.map(wl => `
          <button class="pill-btn ${wl.id === w.id ? 'active' : ''}" style="border:1px solid var(--border);" onclick="state.wallId='${wl.id}';state.bayIdx=0;renderAll()">
            ${wl.shortLabel} · ${fmtFtIn(wl.clearWidthIn)} (${wl.bays.length})
          </button>`).join('')}
      </div>
      <div style="display:flex;gap:4px;">
        <button class="chip-btn" onclick="state.zoom=1;state.panX=0;state.panY=0;renderStage()">Reset Zoom</button>
      </div>`;
  }
}

function renderStage() {
  const svg = document.getElementById('stageSvg');
  const card = document.getElementById('floatRoomCard');
  const isBp = state.theme === 'blueprint';
  const bg = isBp ? '#0a1220' : '#f7f5ef';
  const wallCol = isBp ? '#e2e8f0' : '#0f172a';
  const roomFill = isBp ? '#132038' : '#ffffff';
  const selFill = isBp ? 'rgba(234,179,8,0.24)' : 'rgba(234,179,8,0.18)';
  const txtMain = isBp ? '#f8fafc' : '#0f172a';
  const txtSub = isBp ? '#94a3b8' : '#475569';
  svg.style.background = bg;

  if (state.mode === 'house') {
    const lrms = levelRooms();
    const ozs = (MATRIX.outdoorZones || []).filter(z => z.level === state.level);
    const vzs = (MATRIX.voidZones || []).filter(z => z.level === state.level);
    const rects = lrms.map(r => ({ r, rc: getEffRect(r) }));
    const allB = [...rects.map(x => x.rc), ...ozs, ...vzs];
    const minX = Math.min(...allB.map(b => b.xIn)) - 48;
    const minY = Math.min(...allB.map(b => b.yIn)) - 48;
    const maxX = Math.max(...allB.map(b => b.xIn + b.widthIn)) + 48;
    const maxY = Math.max(...allB.map(b => b.yIn + b.depthIn)) + 80;
    const baseW = maxX - minX, baseH = maxY - minY;
    const vw = baseW / state.zoom, vh = baseH / state.zoom;
    const vx = minX + (baseW - vw) / 2 - state.panX;
    const vy = minY + (baseH - vh) / 2 - state.panY;
    svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);

    let h = `<defs>
      <pattern id="g60" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="${isBp ? 'rgba(148,163,184,0.09)' : 'rgba(15,23,42,0.08)'}" stroke-width="1"/>
      </pattern>
      <marker id="arr-grn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
      </marker>
      <marker id="arr-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
      </marker>
    </defs>
    <rect x="${minX-500}" y="${minY-500}" width="${baseW+1000}" height="${baseH+1000}" fill="url(#g60)"/>`;

    // Outdoor zones
    ozs.forEach(oz => {
      h += `<rect x="${oz.xIn}" y="${oz.yIn}" width="${oz.widthIn}" height="${oz.depthIn}" fill="${isBp?'rgba(30,41,59,0.4)':'rgba(226,232,240,0.45)'}" stroke="${txtSub}" stroke-width="2" stroke-dasharray="10 7"/>
      <text x="${oz.xIn+oz.widthIn/2}" y="${oz.yIn+oz.depthIn/2}" text-anchor="middle" fill="${txtSub}" font-size="13" font-weight="600">${oz.label} (${fmtFtIn(oz.widthIn)}×${fmtFtIn(oz.depthIn)})</text>`;
    });

    // Voids
    vzs.forEach(vz => {
      h += `<rect x="${vz.xIn}" y="${vz.yIn}" width="${vz.widthIn}" height="${vz.depthIn}" fill="rgba(8,14,26,0.5)" stroke="${txtSub}" stroke-width="2" stroke-dasharray="6 5"/>
      <line x1="${vz.xIn}" y1="${vz.yIn}" x2="${vz.xIn+vz.widthIn}" y2="${vz.yIn+vz.depthIn}" stroke="${txtSub}" stroke-width="1" opacity="0.5"/>
      <line x1="${vz.xIn+vz.widthIn}" y1="${vz.yIn}" x2="${vz.xIn}" y2="${vz.yIn+vz.depthIn}" stroke="${txtSub}" stroke-width="1" opacity="0.5"/>
      <text x="${vz.xIn+vz.widthIn/2}" y="${vz.yIn+vz.depthIn/2}" text-anchor="middle" fill="${txtSub}" font-size="12" font-weight="700">${vz.label}</text>`;
    });

    // Conditioned rooms
    rects.forEach(({ r, rc }) => {
      const sel = r.id === state.roomId;
      const cx = rc.xIn + rc.widthIn / 2, cy = rc.yIn + rc.depthIn / 2;
      const small = rc.widthIn < 88 || rc.depthIn < 66;
      const baysCnt = r.walls.reduce((s, w) => s + w.bays.length, 0);
      h += `<g data-click="1" onclick="selectRoom('${r.id}', false)" ondblclick="selectRoom('${r.id}', true)" style="cursor:pointer;">
        <rect x="${rc.xIn}" y="${rc.yIn}" width="${rc.widthIn}" height="${rc.depthIn}" fill="${sel ? selFill : roomFill}" stroke="${sel ? '#eab308' : wallCol}" stroke-width="${sel ? 5 : 3.2}"/>`;
      if (r.island) {
        h += `<rect x="${cx - r.island.widthIn/2}" y="${cy - r.island.depthIn/2 + 8}" width="${r.island.widthIn}" height="${r.island.depthIn}" fill="rgba(56,189,248,0.16)" stroke="${wallCol}" stroke-width="1.8"/>`;
      }
      (r.planOpenings || []).forEach(op => {
        const horiz = op.wall === 'N' || op.wall === 'S';
        const ox = horiz ? rc.xIn + Math.min(rc.widthIn - op.widthIn, Math.max(0, op.offsetIn)) : (op.wall === 'W' ? rc.xIn - 2.5 : rc.xIn + rc.widthIn - 2.5);
        const oy = horiz ? (op.wall === 'N' ? rc.yIn - 2.5 : rc.yIn + rc.depthIn - 2.5) : rc.yIn + Math.min(rc.depthIn - op.widthIn, Math.max(0, op.offsetIn));
        h += `<rect x="${ox}" y="${oy}" width="${horiz ? op.widthIn : 5}" height="${horiz ? 5 : op.widthIn}" fill="${op.kind === 'window' ? '#38bdf8' : '#f59e0b'}" rx="1.5"/>`;
      });
      h += `<text x="${cx}" y="${cy - (small ? 1 : 9)}" text-anchor="middle" fill="${txtMain}" font-size="${small ? 10 : 13.5}" font-weight="700">${r.number} ${r.name}</text>`;
      if (!small) {
        h += `<text x="${cx}" y="${cy + 9}" text-anchor="middle" fill="${txtSub}" font-size="10.5" font-family="monospace">${fmtFtIn(rc.widthIn)} × ${fmtFtIn(rc.depthIn)}</text>`;
        if (baysCnt > 0 && rc.depthIn >= 92) {
          h += `<text x="${cx}" y="${cy + 24}" text-anchor="middle" fill="${sel ? '#fde047' : '#00e0ff'}" font-size="9.5" font-weight="700">${baysCnt} Bays</text>`;
        }
      }
      h += `</g>`;
    });

    // D1 Leader-Targeted Notes Overlay!
    if (state.showNotes) {
      const lvlNotes = (MATRIX.d1Notes || []).filter(n => n.level === state.level);
      lvlNotes.forEach(n => {
        const isSelRoom = n.targetRoomId === state.roomId;
        const [bx, by] = n.boxXYIn;
        const [tx, ty] = n.tipXYIn;
        const isCross = n.textBoxRoom !== n.targetRoomId;
        const col = isCross ? '#10b981' : '#f59e0b';
        const op = isSelRoom ? '1.0' : '0.42';
        if (n.hasLeader || isCross) {
          h += `<line x1="${bx}" y1="${by}" x2="${tx}" y2="${ty}" stroke="${col}" stroke-width="${isSelRoom ? 2.4 : 1.5}" stroke-dasharray="${isCross ? 'none' : '4 3'}" opacity="${op}" marker-end="url(#${isCross ? 'arr-grn' : 'arr-amb'})"/>`;
        }
        h += `<g data-click="1" onclick="selectRoom('${n.targetRoomId}', false)" style="cursor:pointer;" opacity="${op}">
          <circle cx="${tx}" cy="${ty}" r="${isSelRoom ? 5.5 : 4}" fill="${col}" stroke="#080d16" stroke-width="1.2"/>
          <rect x="${bx - 4}" y="${by - 10}" width="${Math.min(180, n.text.length * 5.6 + 10)}" height="15" rx="3" fill="rgba(8,13,22,0.86)" stroke="${col}" stroke-width="1"/>
          <text x="${bx + 1}" y="${by + 1}" fill="#f8fafc" font-size="8.8" font-weight="600">${n.text.slice(0, 30)}${n.text.length > 30 ? '…' : ''} → ${n.targetRoomId}</text>
        </g>`;
      });
    }

    svg.innerHTML = h;

    // Floating Selected Room Action Card
    const rm = activeRoom();
    const rc = getEffRect(rm);
    const flexObj = Object.values(MATRIX.flexWalls).find(fw => (fw.level || 1) === state.level && (fw.roomAId === rm.id || fw.roomBId === rm.id));
    const nCnt = (MATRIX.d1Notes || []).filter(n => n.targetRoomId === rm.id).length;
    card.style.display = 'flex';
    card.innerHTML = `
      <div>
        <div style="display:flex;align-items:center;gap:7px;">
          <span class="badge" style="background:rgba(234,179,8,0.22);color:var(--gold-lt);">${rm.number}</span>
          <strong style="font-size:15px;">${rm.name}</strong>
          <span style="font-family:monospace;font-size:12px;color:var(--cyan);">${fmtFtIn(rc.widthIn)} × ${fmtFtIn(rc.depthIn)}</span>
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">${rm.subtitle} · <b style="color:#6ee7b7;">${nCnt} D1 notes linked</b></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        ${flexObj ? `
          <button class="chip-btn" onclick="nudgeFlex('${flexObj.id}', -1)">−1"</button>
          <span style="font-family:monospace;font-size:11px;color:var(--amber);">Flex ${flexObj.nudgeIn > 0 ? '+' : ''}${flexObj.nudgeIn}"</span>
          <button class="chip-btn" onclick="nudgeFlex('${flexObj.id}', 1)">+1"</button>` : ''}
        <button class="chip-btn gold" onclick="selectRoom('${rm.id}', true)">Open Room Studio →</button>
      </div>`;
  } else {
    // ROOM ELEVATION + PLAN STUDIO STAGE
    card.style.display = 'none';
    const rm = activeRoom();
    const w = activeWall();
    const W = w.clearWidthIn, H = w.ceilingHeightIn || 120;
    const pad = 54;
    const vw = (W + pad * 2) / state.zoom, vh = (H + pad * 2.3) / state.zoom;
    const vx = -pad + (W + pad * 2 - vw) / 2 - state.panX;
    const vy = -pad + (H + pad * 2.3 - vh) / 2 - state.panY;
    svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);

    const totalBayW = w.bays.reduce((s, b) => s + b.widthIn, 0);
    let curX = Math.max(0, (W - totalBayW) / 2);

    let h = `<text x="0" y="-22" fill="${txtMain}" font-size="11" font-weight="700" font-family="monospace">${rm.number} ${rm.name.toUpperCase()} — ${w.title.toUpperCase()}</text>
    <rect x="0" y="0" width="${W}" height="${H}" fill="${isBp ? '#0e1a2f' : '#ffffff'}" stroke="${wallCol}" stroke-width="2.6"/>
    <!-- 36 in Counter & 108 in Head Datums -->
    <line x1="-18" y1="${H - 36}" x2="${W + 18}" y2="${H - 36}" stroke="#0284c7" stroke-width="0.9" stroke-dasharray="5 4"/>
    <text x="${W + 22}" y="${H - 33}" fill="#38bdf8" font-size="8" font-family="monospace">36" COUNTER</text>
    <line x1="-18" y1="${H - 108}" x2="${W + 18}" y2="${H - 108}" stroke="#eab308" stroke-width="0.9" stroke-dasharray="5 4"/>
    <text x="${W + 22}" y="${H - 105}" fill="#fde047" font-size="8" font-family="monospace">9'-0" ALIGN</text>`;

    if (w.bays.length === 0) {
      h += `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="${txtSub}" font-size="11">Clear Architectural Wall (${fmtFtIn(W)} × ${fmtFtIn(H)}) — Pick another wall tab above</text>`;
    }

    w.bays.forEach((b, idx) => {
      const bx = curX, bw = b.widthIn, bh = Math.min(H, b.heightIn || 36);
      const by = H - bh - (b.affIn || 0);
      const isSel = idx === state.bayIdx;
      h += `<g data-click="1" onclick="state.bayIdx=${idx};renderAll()" style="cursor:pointer;">
        <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="${isSel ? 'rgba(0,224,255,0.2)' : 'rgba(184,134,11,0.16)'}" stroke="${isSel ? '#00e0ff' : wallCol}" stroke-width="${isSel ? 2.4 : 1.5}"/>
        <line x1="${bx+2}" y1="${by+4}" x2="${bx+bw-2}" y2="${by+4}" stroke="${wallCol}" stroke-width="1"/>
        <text x="${bx + bw/2}" y="${by + bh/2 - 3}" text-anchor="middle" fill="${txtMain}" font-size="7.5" font-weight="700">${b.label.slice(0, 22)}</text>
        <text x="${bx + bw/2}" y="${by + bh/2 + 8}" text-anchor="middle" fill="${txtSub}" font-size="7" font-family="monospace">${fmtFtIn(bw)} W × ${fmtFtIn(bh)} H</text>
      </g>`;
      // Bay width dim tick
      h += `<line x1="${bx}" y1="${H + 16}" x2="${bx + bw}" y2="${H + 16}" stroke="#38bdf8" stroke-width="1"/>
            <text x="${bx + bw/2}" y="${H + 26}" text-anchor="middle" fill="#7dd3fc" font-size="7.5" font-family="monospace">${fmtFtIn(bw)}</text>`;
      curX += bw;
    });

    // Overall clear wall dimension
    h += `<line x1="0" y1="${H + 36}" x2="${W}" y2="${H + 36}" stroke="${wallCol}" stroke-width="1.3"/>
          <text x="${W/2}" y="${H + 48}" text-anchor="middle" fill="${txtMain}" font-size="9" font-weight="700" font-family="monospace">${fmtFtIn(W)} CLEAR WALL</text>`;
    svg.innerHTML = h;
  }
}

function renderInspector() {
  const rm = activeRoom();
  const w = activeWall();
  const roomNotes = (MATRIX.d1Notes || []).filter(n => n.targetRoomId === rm.id);
  const allRoomsOpts = MATRIX.rooms.map(r => `<option value="${r.id}">${r.number} ${r.name} (L${r.level||1})</option>`).join('');

  let html = `
    <div>
      <div class="sec-lbl">📝 D1 Plan Notes Linked to ${rm.number} ${rm.name} (${roomNotes.length})</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">
        Solved via <b>Leader Arrowhead Tip</b> + <b>Domain Keyword Guard</b> (retarget any note in 1 tap):
      </div>
      ${roomNotes.length === 0 ? `<div class="note-card" style="color:var(--muted);">No D1 callout notes pointed into this room.</div>` : ''}
      ${roomNotes.map(n => {
        const cross = n.textBoxRoom !== n.targetRoomId;
        return `<div class="note-card">
          <div style="font-weight:700;color:var(--text);margin-bottom:4px;">"${n.text}"</div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">
            <span class="badge ${cross ? 'badge-ldr' : 'badge-ret'}">
              ${cross ? `Box in ${n.textBoxRoom} → Arrow to ${n.targetRoomId}` : `Inside ${n.targetRoomId} (${n.method})`}
            </span>
            <select aria-label="Reassign Note Room" onchange="reassignNote('${n.id}', this.value)" style="background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:5px;font-size:11px;padding:2px 5px;">
              ${MATRIX.rooms.map(r => `<option value="${r.id}" ${r.id === n.targetRoomId ? 'selected' : ''}>→ ${r.number} ${r.name}</option>`).join('')}
            </select>
          </div>
        </div>`;
      }).join('')}
    </div>

    <div>
      <div class="sec-lbl">🎛️ ${w.shortLabel} Wall Parametric Bays (${w.bays.length})</div>
      ${w.bays.length === 0 ? `<div class="bay-card" style="color:var(--muted);">No casework on ${w.shortLabel} wall — switch wall tabs in Room Studio.</div>` : ''}
      ${w.bays.map((b, idx) => `
        <div class="bay-card" style="margin-bottom:6px;border-color:${idx === state.bayIdx ? 'var(--cyan)' : 'var(--border)'};">
          <div style="display:flex;justify-content:space-between;font-weight:700;">
            <span>#${idx+1} ${b.label}</span>
            <span style="font-family:monospace;color:var(--cyan);">${fmtFtIn(b.widthIn)}</span>
          </div>
          <div style="display:flex;gap:5px;margin-top:6px;">
            <button class="chip-btn" onclick="adjustBayWidth(${idx}, -3)">−3"</button>
            <button class="chip-btn" onclick="adjustBayWidth(${idx}, -0.5)">−½"</button>
            <button class="chip-btn" onclick="adjustBayWidth(${idx}, 0.5)">+½"</button>
            <button class="chip-btn" onclick="adjustBayWidth(${idx}, 3)">+3"</button>
          </div>
        </div>`).join('')}
    </div>`;

  document.getElementById('rightInspector').innerHTML = html;
}

renderAll();
</script>
</body>
</html>
